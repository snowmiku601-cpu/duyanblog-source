<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Duyan Blog — nón lá mark">
  <!--
    Duyan Blog logo symbol — the Vietnamese conical hat (nón lá) reduced to a
    geometric mark: a conical silhouette with a gently curved brim, two rib
    lines knocked out of the silhouette (fill-rule: evenodd, so the "lines"
    are transparent and the mark works on any background) and a small sun dot
    near the apex. Reads at 16×16, works in one colour. See DESIGN.md.
  -->
  <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" d="
    M32 8 L59 49 Q32 57.5 5 49 Z
    M16.85 31 Q32 34.5 47.15 31 L47.15 34.5 Q32 38 16.85 34.5 Z
    M9.6 42 Q32 45.5 54.4 42 L54.4 45.5 Q32 49 9.6 45.5 Z
    M29.4 21.5 a2.6 2.6 0 1 0 5.2 0 a2.6 2.6 0 1 0 -5.2 0 Z
  "/>
</svg>
